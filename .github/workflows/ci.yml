name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install -e . pytest
      - if: runner.os == 'Linux'
        run: python -c "from aqh.sandbox import kind; assert kind() == 'bubblewrap', kind()"
      - if: runner.os == 'macOS'
        run: python -c "from aqh.sandbox import kind; assert kind() == 'seatbelt', kind()"
      - run: python -m pytest -q -rs
      - run: aqh doctor
